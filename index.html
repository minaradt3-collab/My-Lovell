<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SODO ✦ A Journey Through Space</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas><div class="neb"></div><div class="bar" id="bar"></div>

<div class="music-player" aria-label="Background music">
  <button id="musicToggle" type="button" aria-label="Play music">♫ Play music</button>
</div>

<section class="hero" id="hero">
  <div class="word" id="word"></div>
  <p class="hint">✦ double tap the name ✦</p>
  <button class="start" id="go">Begin the journey</button>
</section>

<div id="stops"></div>

<section class="end">
  <div class="big">SODO <span class="heart">♥</span></div>
  <p style="font-size:1.2rem;letter-spacing:.12em;opacity:.85">You are my whole universe</p>
</section>

<script src="script.js"></script>
</body>
</html>
